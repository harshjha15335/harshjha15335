<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="880" height="66" viewBox="0 0 880 66" role="img" aria-labelledby="title desc">
<title id="title">Selected projects</title>
<desc id="desc">Section header for 4 selected projects.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1120"/><stop offset="1" stop-color="#04060c"/></linearGradient>
<radialGradient id="gBlue"><stop offset="0" stop-color="#3b82f6" stop-opacity="0.336"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
<radialGradient id="gGreen"><stop offset="0" stop-color="#22c55e" stop-opacity="0.24"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></radialGradient>
<radialGradient id="gViolet"><stop offset="0" stop-color="#a855f7" stop-opacity="0.336"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
<radialGradient id="gTeal"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.24"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6" stop-opacity=".75"/><stop offset=".45" stop-color="#22d3ee" stop-opacity=".45"/><stop offset=".72" stop-color="#a855f7" stop-opacity=".6"/><stop offset="1" stop-color="#2dd4bf" stop-opacity=".7"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93c5fd" stop-opacity=".05"/><stop offset=".55" stop-color="#93c5fd" stop-opacity=".012"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6" stop-opacity="0"/><stop offset=".35" stop-color="#6366f1" stop-opacity=".55"/><stop offset=".6" stop-color="#a855f7" stop-opacity=".85"/><stop offset=".85" stop-color="#2dd4bf" stop-opacity=".55"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><rect width="880" height="66" rx="14"/></clipPath>
<linearGradient id="scanG" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
<style>
  .sans{font-family:'Segoe UI', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
  .drift{animation:drift 16s ease-in-out infinite alternate}
  .drift2{animation:drift 21s ease-in-out -7s infinite alternate-reverse}
  .breathe{animation:breathe 7s ease-in-out infinite}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes drift{from{transform:translate(-14px,-4px)}to{transform:translate(16px,6px)}}
  @keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.drift,.drift2,.breathe,.blink,.anim{animation:none!important}}.scan{animation:scan 6s ease-in-out infinite}@keyframes scan{0%{transform:translateX(0)}50%{transform:translateX(712px)}100%{transform:translateX(0)}}</style>
</defs>
<rect width="880" height="66" rx="14" fill="url(#bg)"/>
<g clip-path="url(#clip)">
<ellipse class="drift" cx="176" cy="3.3" rx="228.8" ry="49.5" fill="url(#gBlue)"/>
<ellipse class="drift2" cx="563.2" cy="11.88" rx="264" ry="52.8" fill="url(#gGreen)"/>
<ellipse class="drift" cx="528" cy="67.32" rx="237.6" ry="27.72" fill="url(#gViolet)"/>
<ellipse class="drift2" cx="880" cy="52.8" rx="105.6" ry="33" fill="url(#gTeal)"/>
<rect x="70.4" y="63.5" width="739.2" height="2.5" fill="url(#floor)" class="breathe"/>
</g>

<rect x=".75" y=".75" width="878.5" height="64.5" rx="13.25" fill="none" stroke="url(#edge)" stroke-opacity="1" stroke-width="1.5"/>

<text x="30" y="34" class="mono" font-size="13" font-weight="700" letter-spacing="2" fill="#38bdf8">PROJECTS.LIST</text>
<text x="176" y="34" class="mono" font-size="11" fill="#6e7681">~/harshjha15335/selected</text>
<text x="850" y="34" text-anchor="end" class="mono" font-size="11" fill="#6e7681">● 4 projects</text>
<line x1="24" y1="48" x2="856" y2="48" stroke="#60a5fa" stroke-opacity=".35"/>
<rect class="anim scan" x="24" y="47" width="120" height="2" rx="1" fill="url(#scanG)"/>
</svg>
