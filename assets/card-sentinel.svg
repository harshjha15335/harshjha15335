<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="430" height="178" viewBox="0 0 430 178" role="img" aria-labelledby="title desc">
<title id="title">SENTINEL — Python project</title>
<desc id="desc">AI payment trust for PayPal merchants: SHAP risk scores, human approvals. Language mix: Python 55%, TypeScript 43%, Shell 1%. Last pushed 2026-10-11.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1120"/><stop offset="1" stop-color="#04060c"/></linearGradient>
<radialGradient id="gBlue"><stop offset="0" stop-color="#3b82f6" stop-opacity="0.315"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
<radialGradient id="gGreen"><stop offset="0" stop-color="#22c55e" stop-opacity="0.22499999999999998"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></radialGradient>
<radialGradient id="gViolet"><stop offset="0" stop-color="#a855f7" stop-opacity="0.315"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
<radialGradient id="gTeal"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22499999999999998"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6" stop-opacity=".75"/><stop offset=".45" stop-color="#22d3ee" stop-opacity=".45"/><stop offset=".72" stop-color="#a855f7" stop-opacity=".6"/><stop offset="1" stop-color="#2dd4bf" stop-opacity=".7"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93c5fd" stop-opacity=".05"/><stop offset=".55" stop-color="#93c5fd" stop-opacity=".012"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6" stop-opacity="0"/><stop offset=".35" stop-color="#6366f1" stop-opacity=".55"/><stop offset=".6" stop-color="#a855f7" stop-opacity=".85"/><stop offset=".85" stop-color="#2dd4bf" stop-opacity=".55"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><rect width="430" height="178" rx="14"/></clipPath>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
  .sans{font-family:'Segoe UI', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
  .drift{animation:drift 16s ease-in-out infinite alternate}
  .drift2{animation:drift 21s ease-in-out -7s infinite alternate-reverse}
  .breathe{animation:breathe 7s ease-in-out infinite}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes drift{from{transform:translate(-14px,-4px)}to{transform:translate(16px,6px)}}
  @keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.drift,.drift2,.breathe,.blink,.anim{animation:none!important}}.orbit{animation:orbit 18s linear infinite}@keyframes orbit{to{transform:rotate(360deg)}}</style>
</defs>
<rect width="430" height="178" rx="14" fill="url(#bg)"/>
<g clip-path="url(#clip)">
<ellipse class="drift" cx="86" cy="8.9" rx="150" ry="133.5" fill="url(#gBlue)"/>
<ellipse class="drift2" cx="275.2" cy="32.04" rx="150" ry="142.4" fill="url(#gGreen)"/>
<ellipse class="drift" cx="258" cy="181.56" rx="130" ry="74.76" fill="url(#gViolet)"/>
<ellipse class="drift2" cx="430" cy="142.4" rx="80" ry="89" fill="url(#gTeal)"/>
<rect x="34.4" y="175.5" width="361.2" height="2.5" fill="url(#floor)" class="breathe"/>
</g>

<rect x=".75" y=".75" width="428.5" height="176.5" rx="13.25" fill="none" stroke="url(#edge)" stroke-opacity="1" stroke-width="1.5"/>

<line x1="0" y1="28" x2="430" y2="28" stroke="#60a5fa" stroke-opacity=".3"/>
<circle cx="18" cy="14.5" r="3" fill="#22d3ee" class="breathe"/>
<text x="27" y="18" class="mono" font-size="10.5" fill="#8b949e">SENTINEL-</text>
<rect x="403" y="9.5" width="10" height="10" rx="2" fill="none" stroke="#8b949e" stroke-opacity=".7"/>
<text x="18" y="63" class="mono" font-size="20" font-weight="800" fill="#f0f6fc">SENTINEL<tspan class="blink" fill="#22d3ee"> _</tspan></text>
<text x="18" y="88" class="mono" font-size="12.5" fill="#8b949e">AI payment trust for PayPal merchants:</text>
<text x="18" y="105" class="mono" font-size="12.5" fill="#8b949e">SHAP risk scores, human approvals.</text>
<g transform="translate(18,118)"><rect width="65.6" height="20" rx="10" fill="#3572A5" fill-opacity=".16" stroke="#3572A5" stroke-opacity=".75"/>
<circle cx="11" cy="10" r="3" fill="#3572A5"/><text x="19" y="14" class="mono" font-size="10.5" font-weight="700" fill="#d1d9e0">Python</text></g>
<circle cx="22" cy="160" r="2.6" fill="#3b82f6"/><circle cx="32" cy="160" r="2.6" fill="#a855f7" fill-opacity=".8"/>
<text x="44" y="163.5" class="mono" font-size="9.5" fill="#6e7681">updated 2026-10-11</text>
<g filter="url(#soft)">
<circle cx="364" cy="98" r="30" fill="none" stroke="#1f2937" stroke-width="8"/><circle cx="364" cy="98" r="30" fill="none" stroke="#3572A5" stroke-width="8" stroke-dasharray="101.99 86.51" stroke-dashoffset="0" transform="rotate(-90 364 98)"/><circle cx="364" cy="98" r="30" fill="none" stroke="#3178c6" stroke-width="8" stroke-dasharray="78.16 110.34" stroke-dashoffset="-103.99" transform="rotate(-90 364 98)"/><circle cx="364" cy="98" r="30" fill="none" stroke="#89e051" stroke-width="8" stroke-dasharray="0.5 188" stroke-dashoffset="-184.15" transform="rotate(-90 364 98)"/><circle cx="364" cy="98" r="30" fill="none" stroke="#8b949e" stroke-width="8" stroke-dasharray="0.88 187.61" stroke-dashoffset="-185.61" transform="rotate(-90 364 98)"/></g>
<circle class="anim orbit" cx="364" cy="98" r="39" fill="none" stroke="#60a5fa" stroke-opacity=".5" stroke-width="1.2" stroke-dasharray="4 10" style="transform-origin:364px 98px"/>
<text x="364" y="99" text-anchor="middle" class="sans" font-size="14" font-weight="800" fill="#f0f6fc">55%</text>
<text x="364" y="112" text-anchor="middle" class="mono" font-size="8.5" fill="#8b949e">PY</text>
</svg>
